name: Inspect habit synchronization rendering (temporary)
on:
  push:
    paths: ['.github/workflows/inspect-habits-temporary.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect habit renderer and save/load logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          for a,b in [(14672900,14677000),(14676800,14680500),(14680500,14682400)]:
            print('CODE RANGE',a,b)
            print(s[a:b].replace('\\n','\n'))
          for term in ['function load(', 'function save(', 'function restore(', 'function normalize', 'function isComplete(', 'habit-entry', 'habit-detail', 'habit-name']:
            found=[m.start() for m in re.finditer(re.escape(term),s) if m.start()>14234000]
            print('TERM',term,'offsets',found[:12])
            for p in found[:2]:
              if 14234000<p<14710000:
                print(s[max(14234000,p-380):p+1300])
          PY
