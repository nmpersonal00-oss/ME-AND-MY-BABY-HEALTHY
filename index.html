<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#39212b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wifey & Hubby" />
  <meta name="description" content="A cozy little home for Wifey & Hubby." />
  <link rel="icon" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Wifey & Hubby</title>
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <main id="home-page" class="page home-page" aria-label="Home">
      <div class="room-art" aria-hidden="true"></div>
      <div class="hero-veil" aria-hidden="true"></div>

      <div class="status-bar" aria-hidden="true">
        <span id="status-time">9:41</span>
        <span class="status-icons">
          <svg viewBox="0 0 26 19" width="23" height="18" fill="currentColor"><rect x="1" y="13" width="4" height="5" rx="1"/><rect x="7" y="10" width="4" height="8" rx="1"/><rect x="13" y="6" width="4" height="12" rx="1"/><rect x="19" y="2" width="4" height="16" rx="1"/></svg>
          <svg viewBox="0 0 26 19" width="22" height="18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M2 6Q13 -2 24 6"/><path d="M6 11Q13 5 20 11"/><path d="M11 16Q13 14 15 16"/></svg>
          <svg viewBox="0 0 30 17" width="27" height="17" fill="none"><rect x="1" y="1" width="25" height="15" rx="4" stroke="currentColor" stroke-width="2"/><rect x="4" y="4" width="18" height="9" rx="2" fill="currentColor"/><path d="M28 6v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </div>

      <header class="home-header">
        <svg class="header-corner left-corner" viewBox="0 0 24 36" aria-hidden="true"><path d="M20 3 5 18l15 15"/></svg>
        <svg class="header-corner right-corner" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 25h10M26 15h10M20 4v8M20 28v8M7 6l5 5M29 29l5 5M30 8l-5 5M7 34l5-5"/></svg>
        <h1 class="welcome-text"><span id="greeting">Good Evening</span><span>Wifey &amp; Hubby</span></h1>
        <div class="date-pill" id="today-date">Tue, Oct 27</div>
        <p class="two-clocks" id="two-clocks"><span>Wifey · --:--</span><span class="clock-star">✦</span><span>Hubby · --:--</span></p>
      </header>

      <div class="progress-stack" aria-label="Today's progress">
        <button class="progress-card" id="tasks-card" type="button" aria-label="View today's tasks in Habits">
          <span class="progress-header">
            <svg class="card-icon flower-icon" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="flower-gradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9ec"/><stop offset=".5" stop-color="#ffb5cd"/><stop offset="1" stop-color="#e96b9e"/></linearGradient></defs><g fill="url(#flower-gradient)" stroke="#ffe8e7" stroke-width="1.6"><ellipse cx="24" cy="12.5" rx="8.5" ry="10"/><ellipse cx="35" cy="20" rx="8.5" ry="10" transform="rotate(70 35 20)"/><ellipse cx="30.5" cy="33" rx="8.5" ry="10" transform="rotate(145 30.5 33)"/><ellipse cx="17" cy="33" rx="8.5" ry="10" transform="rotate(215 17 33)"/><ellipse cx="12.5" cy="20" rx="8.5" ry="10" transform="rotate(290 12.5 20)"/></g><circle cx="24" cy="23" r="5" fill="#fff5b6"/></svg>
            <span class="progress-label">Today’s Tasks</span>
            <svg class="card-arrow" viewBox="0 0 20 24" aria-hidden="true"><path d="m5 3 9 9-9 9"/></svg>
          </span>
          <span class="progress-bottom">
            <span class="meter-track" id="task-track" role="progressbar" aria-label="Completed tasks" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span class="liquid-fill task-fill" id="tasks-fill" style="--fill:0%"></span>
              <span class="track-glint" aria-hidden="true">✦</span>
            </span>
            <span class="progress-number" id="tasks-number">0%</span>
          </span>
        </button>

        <button class="progress-card water-card" id="water-card" type="button" aria-label="View today's water intake in Habits">
          <span class="progress-header">
            <svg class="card-icon droplet-icon" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="drop-gradient" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbd5ff"/><stop offset=".55" stop-color="#db93dc"/><stop offset="1" stop-color="#9951af"/></linearGradient></defs><path d="M24 3C17 14 8 23 8 32a16 16 0 0 0 32 0C40 23 31 13 24 3Z" fill="url(#drop-gradient)" stroke="#ffe0f9" stroke-width="2.2"/><path d="M16 30c.5-5 3-10 6-14" stroke="#fff7fc" stroke-linecap="round" stroke-width="3"/></svg>
            <span class="progress-label">Water Intake</span>
            <svg class="card-arrow" viewBox="0 0 20 24" aria-hidden="true"><path d="m5 3 9 9-9 9"/></svg>
          </span>
          <span class="progress-bottom">
            <span class="meter-track" id="water-track" role="progressbar" aria-label="Water glasses consumed" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0">
              <span class="liquid-fill water-fill" id="water-fill" style="--fill:0%"></span>
              <span class="track-glint" aria-hidden="true">✦</span>
            </span>
            <span class="progress-number" id="water-number">0/8</span>
          </span>
        </button>
      </div>
    </main>

    <main id="blank-page" class="page blank-page" aria-label="Other tab" hidden>
      <div class="blank-room-art" aria-hidden="true"></div>
      <div class="blank-fade" aria-hidden="true"></div>
      <h1 class="blank-heading" id="blank-heading"></h1>
    </main>

    <nav class="bottom-tabs" aria-label="Main navigation">
      <button type="button" class="tab active" data-tab="home" aria-current="page">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="m4 19 16-14 16 14M9 17v18h9V24h6v11h8V17"/></svg><span>Home</span>
      </button>
      <button type="button" class="tab" data-tab="habits">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 35S5 26 5 16a9 9 0 0 1 15-6 9 9 0 0 1 15 6c0 10-15 19-15 19Z"/><path d="M20 29s-9-6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-9 12-9 12Z"/></svg><span>Habits</span>
      </button>
      <button type="button" class="tab" data-tab="chores">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 35S5 26 5 16a9 9 0 0 1 15-6 9 9 0 0 1 15 6c0 10-15 19-15 19Z"/><path d="M20 13v13M14 19h12"/></svg><span>Chores</span>
      </button>
      <button type="button" class="tab" data-tab="wellness">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 20C9 19 7 9 14 6c4-2 7 2 6 14Zm0 0C31 19 33 9 26 6c-4-2-7 2-6 14Zm0 0C7 13 2 22 9 28c4 3 9 0 11-8Zm0 0c13-7 18 2 11 8-4 3-9 0-11-8Zm0 0c-4 11 2 17 9 14 5-3 1-10-9-14Zm0 0c4 11-2 17-9 14-5-3-1-10 9-14Z"/><circle cx="20" cy="20" r="3"/></svg><span>Wellness</span>
      </button>
      <button type="button" class="tab" data-tab="games">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 14h16c5 0 8 3 9 13 1 8-4 10-9 4l-4-4h-8l-4 4c-5 6-10 4-9-4 1-10 4-13 9-13Z"/><path d="M13 19v9M8.5 23.5h9M27 21h.5M31 25h.5"/></svg><span>Games</span>
      </button>
      <button type="button" class="tab" data-tab="more">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="11" cy="11" r="3"/><circle cx="29" cy="11" r="3"/><circle cx="11" cy="29" r="3"/><circle cx="29" cy="29" r="3"/><path d="M18 11h4M18 29h4M11 18v4M29 18v4"/></svg><span>More</span>
      </button>
    </nav>
  </div>
</body>
</html>
