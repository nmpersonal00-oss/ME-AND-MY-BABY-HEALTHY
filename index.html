  height: 100dvh;

  overflow: hidden;
  background: #422630;
}
.page { position: absolute; inset: 0; overflow: hidden; }
.page[hidden] { display: none !important; }

 .hero-veil {
  bottom: auto;
  height: 32%;
  background: linear-gradient(180deg,rgba(41,17,28,.58) 0%,rgba(41,17,28,.33) 55%,rgba(41,17,28,0) 100%);
}

.home-header {
  position: absolute;
  z-index: 2;
  top: clamp(43px, 7.7dvh, 71px);
  left: 5.5%;
  width: 89%;
  text-align: center;
}
.welcome-text {
  display: flex;
  flex-direction: column;
  gap: 0;
  font-size: clamp(25px, 7.1vw, 34px);
  line-height: 1.20;
  font-weight: 400;
  letter-spacing: -.6px;
  margin: 0 0 clamp(11px, 1.8dvh, 17px);
  color: #ffe2df;
  text-shadow: 0 0 5px rgba(239,117,130,.95), 0 0 19px rgba(255,117,140,.40), 0 2px 2px #47212a;
}
.header-corner {
  position: absolute;
  top: 0;
  width: 21px;
  height: 35px;
  fill: none;
  stroke: #ffd8d5;
  stroke-width: 3.1;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 4px #ff9d9d);
  pointer-events: none;
}
.left-corner { left: 1%; }
.right-corner { right: 0; width: 31px; stroke-width: 2.1; }
.date-pill {
  display: inline-block;
  min-width: 139px;
  padding: 8px 20px 9px;
  border-radius: 99px;
  border: 1.5px solid rgba(255,208,189,.86);
  background: linear-gradient(160deg, rgba(190,126,123,.74), rgba(99,50,60,.84) 75%);
  box-shadow: inset 0 1px 7px rgba(255,233,201,.55), 0 0 8px rgba(255,170,154,.5);
  font-size: clamp(16px, 4.6vw, 21px);
  line-height: 1.15;
  text-shadow: 0 1px 4px #602d3b;
}
.two-clocks {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: nowrap;
  gap: 7px;
  margin: 10px 0 0;
  font-size: clamp(9px, 2.65vw, 12px);
  white-space: nowrap;
  color: rgba(255,226,224,.96);
  text-shadow: 0 1px 5px #4f2431;
}
.clock-star { color: #fff3b6; text-shadow: 0 0 8px #fff3b6; }
.progress-stack {
  position: absolute;
  left: 8.2%;
  right: 8.2%;
  bottom: calc(114px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 3;
}

.progress-card {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 100%;
  height: clamp(76px, 10.15dvh, 91px);
  padding: 9px 18px 10px;
  text-align: left;
  cursor: pointer;
  border: 1.5px solid rgba(255,195,191,.91);
  border-radius: 26px;
  background: linear-gradient(145deg, rgba(127,72,81,.98), rgba(96,52,65,.97) 80%);
  box-shadow:
    inset 0 0 16px rgba(255,190,176,.21),
    inset 0 1px 1px rgba(255,235,220,.72),
    0 0 0 2px rgba(241,131,145,.12),
    0 0 14px rgba(255,132,140,.44),
    0 7px 15px rgba(46,15,29,.28);
  overflow: hidden;
  transition: transform .18s ease, box-shadow .2s ease;
}
.progress-card::before {
  content: '✦';
  position: absolute;
  right: 3px;
  top: 2px;
  color: #ffeec9;
  font-size: 10px;
  text-shadow: 0 0 7px #ffdda1;
}
.progress-card:active { transform: scale(.985); }
.progress-card:hover {
  box-shadow: inset 0 0 16px rgba(255,190,176,.32), 0 0 19px rgba(255,145,165,.5);
}
.progress-header { display: flex; align-items: center; min-height: 33px; gap: 10px; }
.card-icon { height: clamp(29px, 4.2dvh, 38px); width: clamp(29px, 4.2dvh, 38px); flex-shrink: 0; filter: drop-shadow(0 0 4px rgba(255,167,191,.95)); }
.progress-label { font-size: clamp(17px, 4.7vw, 23px); letter-spacing: -.25px; flex: 1; text-shadow: 0 1px 5px #6a3642; }
.card-arrow { width: 13px; height: 20px; fill: none; stroke: #ffe2df; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.progress-bottom { display: flex; align-items: center; gap: 11px; padding-left: clamp(7px, 1.5vw, 11px); }
.meter-track {
  position: relative;
  flex: 1;
  display: block;
  min-width: 0;
  height: clamp(16px, 2.5dvh, 23px);
  overflow: hidden;
  border: 1.5px solid #ffd5d1;
  background: rgba(75,32,48,.55);
  border-radius: 99px;
  box-shadow: inset 0 0 5px rgba(255,204,202,.40), 0 0 4px rgba(255,203,201,.25);
}
.meter-track::after {
  content: '';
  position: absolute;
  inset: 2px 5px auto;
  height: 31%;
  border-radius: 100%;
  background: linear-gradient(90deg,transparent,rgba(255,236,217,.28),transparent);
  pointer-events: none;
}
.liquid-fill {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: var(--fill, 0%);
  border-radius: inherit;
  overflow: hidden;
  background:
    radial-gradient(circle at 13% 72%,#fff4c2 0 1px, transparent 2px),
    radial-gradient(circle at 36% 32%,#fff8e7 0 1.2px,transparent 2.1px),
    radial-gradient(circle at 61% 70%,#fff4d4 0 1.1px,transparent 2px),
    radial-gradient(circle at 82% 26%,#fff3e8 0 1px,transparent 1.8px),
    linear-gradient(180deg,#ffb9d7 0%,#f67bab 41%,#f496bf 70%,#faafe0 100%);
  background-size: 43px 15px, 32px 24px, 26px 18px, 38px 24px, 100% 100%;
  box-shadow: 0 0 8px #ffc4e7, inset 0 2px 5px #fff8e7;
  transition: width 850ms cubic-bezier(.2,.8,.2,1);
}
.liquid-fill::before {
  content: '';
  position: absolute;
  inset: -12px -40px;
  background:
    radial-gradient(circle, rgba(255,251,224,.9) 0 1px, transparent 1.7px) 0 0 / 17px 12px,
    radial-gradient(circle, rgba(255,246,238,.8) 0 .6px, transparent 1.5px) 9px 6px / 23px 16px;
  opacity: .52;
  animation: glitter-drift 5s linear infinite;
}
.liquid-fill::after {
  content: '';
  position: absolute;
  left: -40%; top: -80%; width: 70%; height: 240%;
  background: linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);
  transform: rotate(22deg);
  animation: liquid-sheen 3.2s ease-in-out infinite;
}
.water-fill {
  background:
    radial-gradient(circle at 13% 70%,#fff4ff 0 1px,transparent 2px),
    radial-gradient(circle at 70% 28%,#fff5e1 0 1.2px,transparent 2px),
    linear-gradient(180deg,#ffd6ed 0%,#f4a1d5 40%,#c678e1 100%);
  background-size: 26px 22px,32px 16px,100% 100%;
}
.track-glint {
  position: absolute;
  right: 14%;
  top: 50%;
  font-size: 12px;
  line-height: 1;
  opacity: .55;
  color: #ffe4cb;
  transform: translateY(-50%);
  text-shadow: 0 0 8px #ffdcca;
  pointer-events: none;
  animation: glint-pulse 2.8s ease-in-out infinite;
}
.progress-number { width: 47px; flex-shrink: 0; font-size: clamp(14px, 4.3vw, 19px); text-align: center; white-space: nowrap; }

.bottom-tabs {
  position: absolute;
  z-index: 9;
  left: 4.6%;
  right: 4.6%;
  bottom: calc(9px + env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  height: 92px;
  border: 1.5px solid rgba(255,173,176,.76);
  border-radius: 27px;
  background: linear-gradient(145deg, rgba(127,70,76,.98),rgba(78,43,54,.98) 90%);
  box-shadow: inset 0 1px 10px rgba(255,197,182,.22), 0 0 10px rgba(255,131,145,.45), 0 -2px 11px rgba(47,19,30,.55);
  overflow: hidden;
}
.tab {
  border: none;
  border-right: 1px solid rgba(251,183,176,.065);
  border-radius: 21px;
  background: transparent;
  min-width: 0;
  padding: 11px 1px 9px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-evenly;
  gap: 4px;
  color: #ffced0;
  font-size: clamp(10px, 2.75vw, 13px);
  text-shadow: 0 1px 4px rgba(54,16,23,.8);
}
.tab:last-child { border-right: none; }
.tab svg {
  width: clamp(22px, 6.1vw, 29px);
  height: clamp(22px, 6.1vw, 29px);
  fill: none;
  stroke: #ffb5bd;
  stroke-width: 2.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 3px rgba(255,146,164,.83));
}
.tab.active {
  background: linear-gradient(180deg,rgba(242,145,150,.40),rgba(183,91,105,.22));
  border: 1.5px solid rgba(255,189,188,.73);
  box-shadow: inset 0 0 14px rgba(252,178,163,.28), 0 0 9px rgba(252,137,146,.31);
  color: #fff1e8;
}
.tab.active svg { stroke: #ffe0d1; filter: drop-shadow(0 0 3px #ffc4b7); }

            <span class="progress-label">Today’s Tasks</span>

          <span class="progress-bottom">

        <button class="progress-card water-card" id="water-card" type="button" aria-label="View today's water intake in Habits">
          <span class="progress-header">
            <svg class="card-icon droplet-icon" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="drop-gradient" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbd5ff"/><stop offset=".55" stop-color="#db93dc"/><stop offset="1" stop-color="#9951af"/></linearGradient></defs><path d="M24 3C17 14 8 23 8 32a16 16 0 0 0 32 0C40 23 31 13 24 3Z" fill="url(#drop-gradient)" stroke="#ffe0f9" stroke-width="2.2"/><path d="M16 30c.5-5 3-10 6-14" stroke="#fff7fc" stroke-linecap="round" stroke-width="3"/></svg>

              <span class="liquid-fill water-fill" id="water-fill" style="--fill:0%"></span>
              <span class="track-glint" aria-hidden="true">✦</span>

            <span class="progress-number" id="water-number">0/8</span>

    <main id="blank-page" class="page blank-page" aria-label="Other tab" hidden>
      <div class="blank-room-art" aria-hidden="true"></div>

    </main>

    <nav class="bottom-tabs" aria-label="Main navigation">
      <button type="button" class="tab active" data-tab="home" aria-current="page">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="m4 19 16-14 16 14M9 17v18h9V24h6v11h8V17"/></svg><span>Home</span>
      </button>
      <button type="button" class="tab" data-tab="habits">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 35S5 26 5 16a9 9 0 0 1 15-6 9 9 0 0 1 15 6c0 10-15 19-15 19Z"/><path d="M20 29s-9-6-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-9 12-9 12Z"/></svg><span>Habits</span>
      </button>
      <button type="button" class="tab" data-tab="chores">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 35S5 26 5 16a9 9 0 0 1 15-6 9 9 0 0 1 15 6c0 10-15 19-15 19Z"/><path d="M20 13v13M14 19h12"/></svg><span>Chores</span>
      </button>
      <button type="button" class="tab" data-tab="wellness">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 20C9 19 7 9 14 6c4-2 7 2 6 14Zm0 0C31 19 33 9 26 6c-4-2-7 2-6 14Zm0 0C7 13 2 22 9 28c4 3 9 0 11-8Zm0 0c13-7 18 2 11 8-4 3-9 0-11-8Zm0 0c-4 11 2 17 9 14 5-3 1-10-9-14Zm0 0c4 11-2 17-9 14-5-3-1-10 9-14Z"/><circle cx="20" cy="20" r="3"/></svg><span>Wellness</span>
      </button>
      <button type="button" class="tab" data-tab="games">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 14h16c5 0 8 3 9 13 1 8-4 10-9 4l-4-4h-8l-4 4c-5 6-10 4-9-4 1-10 4-13 9-13Z"/><path d="M13 19v9M8.5 23.5h9M27 21h.5M31 25h.5"/></svg><span>Games</span>
      </button>
      <button type="button" class="tab" data-tab="more">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="11" cy="11" r="3"/><circle cx="29" cy="11" r="3"/><circle cx="11" cy="29" r="3"/><circle cx="29" cy="29" r="3"/><path d="M18 11h4M18 29h4M11 18v4M29 18v4"/></svg><span>More</span>
      </button>
    </nav>

<script>
(() => {
  'use strict';

  const config = window.COZY_CONFIG || {};
  const localTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  const wifeZone = validTimeZone(config.wifeTimeZone) || localTimeZone;
  const husbandZone = validTimeZone(config.husbandTimeZone) || localTimeZone;
  const waterGoal = Math.max(1, Math.round(Number(config.waterGoalGlasses) || 8));
  const STORE_KEY = 'wifey-hubby-dashboard-v1';
  const TAB_NAMES = {home: 'Home', habits: 'Habits', chores: 'Chores', wellness: 'Wellness', games: 'Games', more: 'More'};

  const el = id => document.getElementById(id);
  const navButtons = [...document.querySelectorAll('.tab')];

  function validTimeZone(timeZone) {
    if (typeof timeZone !== 'string' || !timeZone.trim()) return null;
    try { new Intl.DateTimeFormat('en-US', {timeZone}); return timeZone; }
    catch { console.warn('Unknown time zone in config.js:', timeZone); return null; }
  }

  function zonedDateKey(date, timeZone) {
    // en-CA formatting isn't consistent across all browsers; use formatToParts.
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone, year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(date);
    const get = type => parts.find(part => part.type === type)?.value || '';
    return `${get('year')}-${get('month')}-${get('day')}`;
  }

  function readState() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      return {
        tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
        water: parsed.water && typeof parsed.water === 'object' ? parsed.water : {}
      };
    } catch {
      return {tasks: [], water: {}};
    }
  }

  function saveState(state) {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    updateDashboard();
  }

  function updateClocks() {
    const now = new Date();
    const localHour = Number(new Intl.DateTimeFormat('en-US', {hour: 'numeric', hourCycle: 'h23'}).format(now));
    const greeting = localHour < 12 ? 'Good Morning' : localHour < 17 ? 'Good Afternoon' : 'Good Evening';
    el('greeting').textContent = greeting;
    el('today-date').textContent = new Intl.DateTimeFormat('en-US', {
      weekday: 'short', month: 'short', day: 'numeric'
    }).format(now);
    const timeText = timeZone => new Intl.DateTimeFormat('en-US', {
      timeZone, hour: 'numeric', minute: '2-digit', hour12: true
    }).format(now);
    el('two-clocks').innerHTML = '';
    const wife = document.createElement('span');
    const star = document.createElement('span');
    const husband = document.createElement('span');
    wife.textContent = `Wifey ${timeText(wifeZone)}`;
    star.textContent = '✦';
    star.className = 'clock-star';
    husband.textContent = `Hubby ${timeText(husbandZone)}`;
    el('two-clocks').append(wife, star, husband);
  }

  function updateDashboard() {
    const state = readState();
    // Filter dated tasks to the viewer's local day; undated tasks are always in scope.
    const today = zonedDateKey(new Date(), localTimeZone);
    const tasks = state.tasks.filter(task => task && (!task.date || task.date === today));
    const completed = tasks.filter(task => task.completed === true).length;
    const percent = tasks.length ? Math.round(completed / tasks.length * 100) : 0;
    const storedWater = state.water[today];
    const glasses = Number.isFinite(Number(storedWater)) ? Math.max(0, Number(storedWater)) : 0;
    const waterPercent = Math.min(100, (glasses / waterGoal) * 100);

    el('tasks-number').textContent = `${percent}%`;
    el('tasks-fill').style.setProperty('--fill', `${percent}%`);
    el('task-track').setAttribute('aria-valuenow', String(percent));
    el('task-track').setAttribute('aria-valuetext', `${completed} of ${tasks.length} tasks completed`);

    el('water-number').textContent = `${Number.isInteger(glasses) ? glasses : glasses.toFixed(1)}/${waterGoal}`;
    el('water-fill').style.setProperty('--fill', `${waterPercent}%`);
    el('water-track').setAttribute('aria-valuemax', String(waterGoal));
    el('water-track').setAttribute('aria-valuenow', String(Math.min(waterGoal, glasses)));
    el('water-track').setAttribute('aria-valuetext', `${glasses} of ${waterGoal} glasses consumed`);
  }

  function showTab(tab) {
    if (!Object.hasOwn(TAB_NAMES, tab)) tab = 'home';
    const isHome = tab === 'home';
    el('home-page').hidden = !isHome;
    el('blank-page').hidden = isHome;
    if (!isHome) {

      el('blank-page').setAttribute('aria-label', TAB_NAMES[tab]);
    }
    navButtons.forEach(btn => {
      const active = btn.dataset.tab === tab;
      btn.classList.toggle('active', active);
      if (active) btn.setAttribute('aria-current', 'page');
      else btn.removeAttribute('aria-current');
    });
    if (isHome) { updateClocks(); updateDashboard(); }
  }

  navButtons.forEach(btn => btn.addEventListener('click', () => showTab(btn.dataset.tab)));
  el('tasks-card').addEventListener('click', () => showTab('habits'));
  el('water-card').addEventListener('click', () => showTab('habits'));

  updateClocks();
  updateDashboard();
  showTab('home');
  setInterval(() => { updateClocks(); updateDashboard(); }, 30_000);
  window.addEventListener('focus', () => { updateClocks(); updateDashboard(); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { updateClocks(); updateDashboard(); }
  });
  window.addEventListener('storage', event => { if (event.key === STORE_KEY) updateDashboard(); });

  // Integration API for the Habits screen we'll build next. No demo data is invented.
  // Tasks: [{ id: '...', completed: true|false, date?: 'YYYY-MM-DD' }]
  // setWaterGlasses(3) updates the current day's water total.
  window.CozyApp = Object.freeze({
    showTab,
    getData: readState,
    setTasks(tasks) {
      if (!Array.isArray(tasks)) throw new TypeError('tasks must be an array');
      const state = readState();
      state.tasks = tasks;
      saveState(state);
    },
    setWaterGlasses(glasses) {
      const count = Number(glasses);
      if (!Number.isFinite(count) || count < 0) throw new RangeError('glasses must be a nonnegative number');
      const state = readState();
      state.water[zonedDateKey(new Date(), localTimeZone)] = count;
      saveState(state);
    },
    getTimeZones: () => ({wifeZone, husbandZone, localTimeZone}),
    refresh: () => { updateClocks(); updateDashboard(); }
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(list => Promise.all(list.map(reg=>reg.unregister()))).catch(()=>{});
  }
  if ('caches' in window) {
    caches.keys().then(keys => Promise.all(keys.filter(k=>k.startsWith('wifey-hubby-')).map(k=>caches.delete(k)))).catch(()=>{});
  }
})();

</script>
